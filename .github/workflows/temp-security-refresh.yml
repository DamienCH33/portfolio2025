name: Temporary Symfony security refresh

on:
  push:
    branches:
      - chore/symfony-security-refresh-2026-10
    paths:
      - ".github/workflows/temp-security-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: test
      APP_SECRET: temporary-ci-secret
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/portfolio_test"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5.12"
          extensions: pdo_pgsql
          tools: composer:v2
      - name: Update supported Symfony 7.4 patches
        run: composer update "symfony/*" --with-all-dependencies --no-interaction --no-progress --no-scripts
      - name: Validate Composer files
        run: composer validate --no-check-publish
      - name: Create database and run migrations
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse
      - name: Check PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Run PHPUnit
        run: vendor/bin/phpunit
      - name: Commit refreshed lock for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already current"
          else
            git add composer.lock
            git commit -m "chore: refresh Symfony dependencies"
            git push origin HEAD
          fi
      - name: Require clean Composer security audit
        run: composer audit --locked
